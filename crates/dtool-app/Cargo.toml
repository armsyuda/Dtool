[package]
name = "dtool-app"
description = "DTool desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
dtool-render.workspace = true
eframe.workspace = true
dtool-strings.workspace = true
dtool-ui.workspace = true
dtool-core.workspace = true
dtool-design.workspace = true
dtool-io.workspace = true
dtool-mcp = { path = "../dtool-mcp" }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "=0.6.2"
windows-sys = { version = "=0.61.2", features = ["Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer", "Win32_UI_WindowsAndMessaging"] }

winit = { version = "=0.30.13", default-features = false }

[[bin]]
name = "dtool"
path = "src/main.rs"
